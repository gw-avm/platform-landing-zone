---
# Not managed by the ALZ bootstrap, so it survives Deploy-Accelerator reruns.
# Needs no Azure credentials: it only reads the code.
name: 03 Static Analysis
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: '1.14.9'

      # Downloads the AVM modules so TFLint can follow module calls.
      - name: Terraform Init
        run: terraform init -backend=false

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: TFLint Init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Warnings are reported; only errors fail the check. TFLint doesn't
      # auto-load terraform.tfvars.json (it holds subscription_ids).
      - name: TFLint
        run: tflint --format compact --minimum-failure-severity=error --var-file=terraform.tfvars.json

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scans this repo's code only. The AVM modules are Microsoft's, and
      # scanning them reports resources that aren't deployed (firewall, vWAN).
      # soft_fail until the first results have been triaged; findings appear
      # in the run log and under Security > Code scanning.
      - name: Checkov
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # v12.3125.0
        with:
          directory: .
          framework: terraform
          download_external_modules: false
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: checkov
